services:
  - type: web
    name: solar-business-manager
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: gunicorn --bind 0.0.0.0:$PORT main:app
    healthCheckPath: /_health
    envVars:
      # Signs login cookies. Generated by Render; never commit a real value.
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: solar-db
          property: connectionString

databases:
  - name: solar-db
    databaseName: solar_erp
    user: solar_user
    plan: free
