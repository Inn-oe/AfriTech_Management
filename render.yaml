services:
  - type: web
    name: solar-business-manager
    runtime: python
    plan: free
    region: oregon
    branch: react-multi-company
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /_health
    envVars:
      # Signs login cookies. Generated by Render; never commit a real value.
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.12.8
      # An existing Render Postgres database in the same workspace and region.
      - key: DATABASE_URL
        fromDatabase:
          name: giebee-db
          property: connectionString

  # WhatsApp sales bot (separate repository). It keeps its own tables (contacts, leads, messages,
  # settings) in the same database. WHATSAPP_TOKEN and PHONE_NUMBER_ID are added in the dashboard.
  - type: web
    name: solar-whatsapp-bot
    runtime: python
    plan: free
    region: oregon
    repo: https://github.com/Inn-oe/solar-whatsapp-bot
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 app:app
    healthCheckPath: /_health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: VERIFY_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: giebee-db
          property: connectionString
