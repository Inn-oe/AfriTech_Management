services:
  - type: web
    name: solar-business-manager
    runtime: python
    plan: free
    region: oregon
    branch: react-multi-company
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build
    startCommand: gunicorn --bind 0.0.0.0:$PORT main:app
    healthCheckPath: /_health
    envVars:
      # Signs login cookies. Generated by Render; never commit a real value.
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: solar-business-db
          property: connectionString

databases:
  - name: solar-business-db
    databaseName: solar_business
    user: solar_user
    region: oregon
    plan: basic-256mb
    diskSizeGB: 1
    postgresMajorVersion: "16"
